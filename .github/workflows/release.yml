name: Release

# Pushing a `vX.Y.Z` tag publishes a GitHub release with the bundle attached (used by HACS) and
# notes built from the Conventional Commits since the previous tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and the tags, to list the commits since the previous release.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)." >&2
            exit 1
          fi
      - run: npm run check
      # GitHub's generated notes only list merged pull requests: build them from the commits instead.
      - name: Write the release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/live-wind-card.js --title "$GITHUB_REF_NAME" --notes-file release-notes.md
