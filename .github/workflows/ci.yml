name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Lint, formatting, tests with coverage thresholds, type check, build and size budget.
      - run: npm run check
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: live-wind-card
          path: dist/live-wind-card.js
          retention-days: 7
